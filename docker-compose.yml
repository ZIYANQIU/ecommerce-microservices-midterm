services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  customerservice:
    build:
      context: ./CustomerService/CustomerService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  sellerservice:
    build:
      context: ./SellerService/SellerService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  productservice:
    build:
      context: ./ProductService/ProductService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: rabbitmq
    depends_on:
      sellerservice:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  orderservice:
    build:
      context: ./OrderService/OrderService.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__HostName: rabbitmq
    depends_on:
      customerservice:
        condition: service_started
      productservice:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  apigateway:
    build:
      context: ./ApiGateway/ApiGateway.Api
      dockerfile: Dockerfile
    ports:
      - "5240:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__OrderServiceBaseUrl: http://orderservice:8080
      Services__ProductServiceBaseUrl: http://productservice:8080
      Services__CustomerServiceBaseUrl: http://customerservice:8080
    depends_on:
      customerservice:
        condition: service_started
      sellerservice:
        condition: service_started
      productservice:
        condition: service_started
      orderservice:
        condition: service_started

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5227:80"
    depends_on:
      apigateway:
        condition: service_started
